[project]
name = "ilaunchify-compliance"
version = "0.1.0"
description = "iLaunchify compliance + nutrition calculation service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "prisma>=0.15.0",
  "httpx>=0.27.0",
  "weasyprint>=62.3",        # PDF label rendering
  "python-multipart>=0.0.12",
  "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
# The rule-pack / rounding engine reads untyped JSON (json.load → Any) and does
# dict[str, Any] lookups; flagging every `return <Any>` adds casts without safety.
# Keep the rest of strict (untyped-defs, missing annotations, etc.) on.
warn_return_any = false

# weasyprint ships no py.typed marker / stubs. In CI it's installed (its native
# Pango/Cairo libs are present), so mypy resolves the module but reports
# import-untyped; locally without it installed the same import is import-not-found.
# A per-module override suppresses both regardless of install state — cleaner than
# an inline ignore whose error code flips between environments.
[[tool.mypy.overrides]]
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
